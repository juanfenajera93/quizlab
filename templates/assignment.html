{% extends "base.html" %}
{% block title %}Tarea — QuizLab{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="/static/css/player.css">
<style>
.hw-wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }
.hw-header { margin-bottom: 24px; }
.hw-header .logo { font-size: 28px; }
.hw-meta { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
.hw-card { background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 22px; margin-bottom: 16px; }
.hw-q-count { font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-muted); margin-bottom: 8px; }
.hw-q-text { font-size: 20px; font-weight: 600; margin-bottom: 16px; line-height: 1.35; }
.hw-q-image { max-width: 100%; border-radius: 10px; margin-bottom: 16px; }
.hw-opt { display: flex; align-items: center; gap: 12px; width: 100%;
  text-align: left; background: var(--surface-2); border: 2px solid var(--border);
  border-radius: 10px; padding: 13px 14px; margin-bottom: 10px; font-size: 16px;
  color: var(--text); cursor: pointer; transition: border-color .15s, background .15s; }
.hw-opt.sel { border-color: var(--lime); background: rgba(185,255,102,0.08); }
.hw-opt .letter { font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
  width: 26px; flex-shrink: 0; }
.hw-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
.hw-input { width: 100%; padding: 12px 14px; font-size: 16px; border-radius: 10px;
  border: 2px solid var(--border); background: var(--surface-2); color: var(--text); }
.hw-order-item { display: flex; align-items: center; gap: 10px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 8px; }
.hw-order-item .arrows button { background: var(--surface); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px; width: 32px; height: 28px; cursor: pointer; }
.hw-review-item { border-bottom: 1px solid var(--border); padding: 12px 0; }
.hw-review-item:last-child { border-bottom: none; }
.hw-review-q { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.hw-review-a { font-size: 13px; color: var(--text-muted); }
.hw-review-a strong { color: var(--text); }
.hw-result-score { font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
  font-size: 56px; color: var(--lime); line-height: 1; }
.hw-deadline-warn { color: var(--fire); font-size: 13px; margin-top: 6px; }
.ok-mark { color: var(--answer-d); } .bad-mark { color: var(--answer-a); }
</style>
{% endblock %}

{% block content %}
<div class="hw-wrap">
  <div class="hw-header">
    <a href="/" class="logo">Quiz<span>Lab</span></a>
    <div class="hw-meta" id="hw-quiz-name">Cargando tarea…</div>
    <div class="hw-deadline-warn" id="hw-deadline" style="display:none"></div>
  </div>

  <!-- Name entry -->
  <div class="hw-card" id="hw-start" style="display:none">
    <div class="hw-q-text" data-i18n="hw_who">¿Quién eres?</div>
    <div id="hw-name-free">
      <input type="text" class="hw-input" id="hw-nickname" maxlength="40"
             placeholder="Tu nombre" autocomplete="off">
    </div>
    <div id="hw-name-roster" style="display:none"></div>
    <div class="hw-nav">
      <span></span>
      <button class="btn btn-primary" id="hw-start-btn" onclick="hwStart()" data-i18n="hw_start">Comenzar →</button>
    </div>
  </div>

  <!-- Question card -->
  <div class="hw-card" id="hw-question" style="display:none">
    <div class="hw-q-count" id="hw-q-count"></div>
    <div class="hw-q-text" id="hw-q-text"></div>
    <img class="hw-q-image" id="hw-q-image" src="" alt="" style="display:none">
    <div id="hw-q-body"></div>
    <div class="hw-nav">
      <button class="btn btn-ghost" id="hw-prev" onclick="hwPrev()">← Anterior</button>
      <button class="btn btn-primary" id="hw-next" onclick="hwNext()">Siguiente →</button>
    </div>
  </div>

  <!-- Result -->
  <div class="hw-card" id="hw-result" style="display:none">
    <div class="hw-q-count" data-i18n="hw_done">Tarea entregada</div>
    <div class="hw-result-score" id="hw-score">0</div>
    <div class="hw-meta" id="hw-correct"></div>
    <h3 style="margin:24px 0 8px;font-size:16px" data-i18n="hw_review">Revisión</h3>
    <div id="hw-review"></div>
  </div>

  <div class="hw-card" id="hw-error" style="display:none">
    <div class="hw-q-text" id="hw-error-msg"></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>window.ASSIGNMENT_CODE = "{{ code }}";</script>
<script src="/static/js/assignment.js"></script>
{% endblock %}
